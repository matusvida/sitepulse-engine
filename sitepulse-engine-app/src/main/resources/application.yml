spring:
  application:
    name: sitepulse-spring-app
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "python-schema-baseline"
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

sitepulse:
  postgres-dsn: ${POSTGRES_DSN:postgresql://sitepulse:sitepulse@localhost:5432/sitepulse}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  storage-provider: ${STORAGE_PROVIDER:minio}
  storage-default-bucket: ${STORAGE_DEFAULT_BUCKET:tower-tl}
  storage-presign-ttl-minutes: ${STORAGE_PRESIGN_TTL_MINUTES:60}
  storage:
    endpoint: ${STORAGE_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:${MINIO_PUBLIC_ENDPOINT:http://localhost:9001}}
    access-key: ${STORAGE_ACCESS_KEY:${MINIO_ACCESS_KEY:admin}}
    secret-key: ${STORAGE_SECRET_KEY:${MINIO_SECRET_KEY:password123}}
    region: ${STORAGE_REGION:eu-central-1}
  yolo-model-path: ${YOLO_MODEL_PATH:yolov8x.pt}
  conf-threshold: ${CONF_THRESHOLD:0.35}
  per-class-thresholds-json: ${PER_CLASS_THRESHOLDS_JSON:{}}
  min-box-area: ${MIN_BOX_AREA:400}
  enable-roi: ${ENABLE_ROI:false}
  roi-config-path: ${ROI_CONFIG_PATH:roi_config.json}
  blur-threshold: ${BLUR_THRESHOLD:50}
  brightness-low: ${BRIGHTNESS_LOW:30}
  brightness-high: ${BRIGHTNESS_HIGH:240}
  skip-bad-quality: ${SKIP_BAD_QUALITY:false}
  sync-cron: ${SYNC_CRON:0 0/10 * * * *}
  detection-sweep-cron: ${DETECTION_SWEEP_CRON:0 5/10 * * * *}
  detection-provider: ${DETECTION_PROVIDER:openai}
  analysis-cron: ${ANALYSIS_CRON:0 0 2 * * *}
  min-detections-active-hour: ${MIN_DETECTIONS_ACTIVE_HOUR:3}
  dropbox-token: ${DROPBOX_TOKEN:}
  dropbox-app-key: ${DROPBOX_APP_KEY:}
  dropbox-app-secret: ${DROPBOX_APP_SECRET:}
  dropbox-refresh-token: ${DROPBOX_REFRESH_TOKEN:}
  openai-api-key: ${OPENAI_API_KEY:}
  openai-model: ${OPENAI_MODEL:gpt-4.1}
  max-image-bytes: ${MAX_IMAGE_BYTES:52428800}
  python-yolo-base-url: ${PYTHON_YOLO_BASE_URL:http://python-yolo:8000}
  image-web-snapshots:
    enabled: ${IMAGE_WEB_SNAPSHOTS_ENABLED:true}
    target-width: ${IMAGE_WEB_SNAPSHOTS_TARGET_WIDTH:1920}
    target-quality: ${IMAGE_WEB_SNAPSHOTS_TARGET_QUALITY:75}
    target-format: ${IMAGE_WEB_SNAPSHOTS_TARGET_FORMAT:WEBP}
    freeze-time: ${IMAGE_WEB_SNAPSHOTS_FREEZE_TIME:17:00:00}

logging:
  level:
    root: INFO
    com.sitepulse.engine: INFO
