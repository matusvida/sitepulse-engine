spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/sitepulse
    username: sitepulse
    password: sitepulse

sitepulse:
  postgres-dsn: postgresql://sitepulse:sitepulse@localhost:5433/sitepulse
  storage-provider: minio
  storage-default-bucket: tower-tl
  storage-presign-ttl-minutes: 60
  storage:
    endpoint: http://localhost:9001
    public-endpoint: http://localhost:9001
    access-key: admin
    secret-key: password123
    region: eu-central-1
  sync-cron: 0 8/20 * * * *
  detection-sweep-cron: 0 7/20 * * * *
  detection-provider: openai
  dropbox-token: ${DROPBOX_TOKEN:}
  dropbox-app-key: ${DROPBOX_APP_KEY:}
  dropbox-app-secret: ${DROPBOX_APP_SECRET:}
  dropbox-refresh-token: ${DROPBOX_REFRESH_TOKEN:}
  openai-model: ${OPENAI_MODEL:gpt-4.1}
  python-yolo-base-url: http://localhost:8000
