services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sitepulse
      POSTGRES_PASSWORD: sitepulse
      POSTGRES_DB: sitepulse
    volumes:
      - pg_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9090"
    ports:
      - "9001:9000"
      - "9091:9090"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data

  python-yolo:
    build:
      context: ./python-yolo
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-yolov8x.pt}

  spring-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      STORAGE_PROVIDER: minio
      STORAGE_DEFAULT_BUCKET: tower-tl
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9001
      STORAGE_ACCESS_KEY: admin
      STORAGE_SECRET_KEY: password123
      STORAGE_REGION: eu-central-1
      ENABLE_ROI: "true"
      POSTGRES_DSN: postgresql://sitepulse:sitepulse@postgres:5432/sitepulse
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY:-}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET:-}
      DROPBOX_REFRESH_TOKEN: ${DROPBOX_REFRESH_TOKEN:-}
      DROPBOX_TOKEN: ${DROPBOX_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PYTHON_YOLO_BASE_URL: http://python-yolo:8000
    depends_on:
      - postgres
      - minio
      - python-yolo

volumes:
  pg_data:
  minio_data:
